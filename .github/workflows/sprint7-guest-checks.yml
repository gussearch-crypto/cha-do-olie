name: Sprint 7 - verificação de convidados
on:
  push:
    branches: [dev-supabase]
    paths:
      - 'guest-filters.mjs'
      - 'admin-entry.jsx'
      - 'tests/guest-filters.test.mjs'
      - 'tests/guest-overview.test.mjs'
      - 'tests/message-templates.test.mjs'
      - '.github/workflows/sprint7-guest-checks.yml'
  pull_request:
    paths:
      - 'guest-filters.mjs'
      - 'admin-entry.jsx'
      - 'tests/guest-filters.test.mjs'
      - 'tests/guest-overview.test.mjs'
permissions:
  contents: read
jobs:
  guest-logic:
    name: Validar filtros e resumo de convidados
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ler código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Testar regras de convidados sem acessar dados reais
        run: node --test tests/guest-filters.test.mjs tests/guest-overview.test.mjs tests/message-templates.test.mjs
